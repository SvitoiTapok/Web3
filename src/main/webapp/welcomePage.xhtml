<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>#{msg.title}</title>
    <h:outputStylesheet name="welcomePage.css" />
   <h:outputScript name="timer.js"/>
</h:head>
<h:body>
    <header>
        #{msg.name}<br/>
        #{msg.group}<br/>
        #{msg.variant}<br/>
    </header>
    <h:form id="timerForm">
        <div style="width: 100%;             text-align: center;">
            <label style='
            font-family: "Times New Roman", "Times New Roman", serif;
            font-size: 60px;

            margin-top: 50px;'>#{msg.cur_t} </label>
            <h:outputText value="${timer.currentTime}" id='timerShow' style='
            font-family: "Times New Roman", "Times New Roman", serif;
            font-size: 60px;

            margin-top: 50px;
            '/>

            <h:commandButton action="#{timer.updateTime}" id="timer" style="display:none;">
                <f:ajax event="click" execute="timer" render="timerShow"/>
            </h:commandButton>

        </div>
        <div style="width: 100%;text-align: center; margin-top: 100px; font-size: 50px">
            <label>#{msg.button}</label>
            <div style="margin-top: 100px; font-size: 50px">
                <h:commandButton value="#{msg.yes}" action="goToMain" style="margin-right: 200px; width: 200px; height: 100px; font-size: 50px"/>
                <h:commandButton id="NO_BUTTON" value="#{msg.no}" action="goToMain" style="width: 200px; height: 100px; font-size: 50px"/>
            </div>
            <h:commandButton value="#{msg.lang_but}" action="#{languageBean.changeLanguage}" style="margin-right: 200px; width: 200px; height: 100px; font-size: 50px; margin-top: 100px"/>

        </div>
    </h:form>

    <h:outputScript>

    </h:outputScript>


</h:body>


</html>
