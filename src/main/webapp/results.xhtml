<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:body>
    <f:view>
        <h:form id="tableForm">
        <h:dataTable value="#{graphManager.hits}" var="hit" border="1" id="table">
            <h:column>
                <f:facet name="header">X, Y, R</f:facet>
                #{hit.x}, #{hit.y}, #{hit.r}
            </h:column>

            <h:column>
                <f:facet name="header">Попадание</f:facet>
                #{hit.hit}
            </h:column>

            <h:column>
                <f:facet name="header">Время обращения к серверу</f:facet>
                #{hit.date}
            </h:column>

            <h:column>
                <f:facet name="header">Время обработки запроса, нс</f:facet>
                #{hit.duration}
            </h:column>
        </h:dataTable>
        <div style="margin-top: 100px; font-size: 20px">
            <h:commandButton value="К основной странице" action="#{navBean.goToMain1}" />
        </div>
        </h:form>
    </f:view>
</h:body>
</html>
