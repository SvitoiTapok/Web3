<f:view>

            <polygon points="50, 250, 250, 250, 250, 450" fill="#4169E1" stroke="black"></polygon>
            <polygon points="250, 250, 450, 250, 450, 350, 250, 350" fill="#4169E1" stroke="black"></polygon>

            <!--<path d="M 250 250 L 50 250 C 305 350 350 305 350 250 Z" fill="#4169E1" stroke="black"></path>
            -->
            <path d="M350,250 A100,100 0 0,0 250,150 L 250 250 L 350 250" stroke="black" fill="#4169E1"/>
            <!--                оси-->
            <line x1="0" y1="250" x2="490" y2="250" stroke="black"></line>
            <line x1="250" y1="500" x2="250" y2="10" stroke="black"></line>
            <!--                y координаты-->
            <line x1="245" y1="50" x2="255" y2="50" stroke="black"></line>
            <line x1="245" y1="150" x2="255" y2="150" stroke="black"></line>
            <line x1="245" y1="350" x2="255" y2="350" stroke="black"></line>
            <line x1="245" y1="450" x2="255" y2="450" stroke="black"></line>
            <!--                x координаты-->
            <line x1="50" y1="245" x2="50" y2="255" stroke="black"></line>
            <line x1="150" y1="245" x2="150" y2="255" stroke="black"></line>
            <line x1="350" y1="245" x2="350" y2="255" stroke="black"></line>
            <line x1="450" y1="245" x2="450" y2="255" stroke="black"></line>
            <!--                стрелочки-->
            <polygon points="242, 20, 250, 0, 258, 20" fill="black"></polygon>
            <polygon points="480, 242, 500, 250, 480, 258" fill="black"></polygon>
            <!--            точка-->
            <circle r="0" id="dot" fill="yellow" stroke="black"></circle>
            <!--                текст-->
            <text x="40" y="240">-R</text>
            <text x="128" y="240">-R/2</text>
            <text x="335" y="240">R/2</text>
            <text x="444" y="240">R</text>

            <text x="260" y="54">R</text>
            <text x="260" y="154">R/2</text>
            <text x="260" y="354">-R/2</text>
            <text x="260" y="454">-R</text>

            <!--                    <circle class="light" style="fill:#40CC40" cx="70" cy="240" r="30" />-->
            <!--                </g>-->
        </svg>
    </div>

<!--    <div id="updateButton">-->
<!--        <button onclick='drawCurrentDot("red")'>-->
<!--            <img src="resources/imgs/update.png"/>-->
<!--        </button>-->

<!--    </div>-->
</div>
    <div id="page">
        <div id="form">
            <h:form name="xyrForm" autocomplete="off" onsubmit="return validateAndSubmit()">
                <div class="changer" id="x">
                    <label>Выберите значение X:</label>
                    <p:spinner id="xValue" widgetVar="spinnerWidget" min="-3" max="3" stepFactor="1" value="#{spinnerBean.number}" required="true">
                        <f:ajax event="change" execute="xValue" render="spinnerK"/>
                    </p:spinner>
                    <h:outputText value="#{spinnerBean.number}" id="spinnerK" style="display:none;"/>
                </div>
                <div class="changer" id="y">
                    <label id="y1">Введите значение Y:</label>
                    <h:inputText id="yInput" value="#{textBean.input}" required="true" placeholder="число от -5 до 3" onblur="validateY()">
                        <f:ajax event="valueChange" execute="yInput" render="yInput output" globalOnly="true"/>
                    </h:inputText>
                    <h:message for="yInput"/>
                    <h:outputText value="#{textBean.input}" id="textK" style="display:none;"/>

<!--                        <input type="text" name="y" id="yInput" />-->
<!--                    </label>-->
<!--                    <span id="yExcept" class="exception"/>-->
                </div>
                <div class="changer" id="r">
                    <label>Выберите значение R:</label>
                    <h:panelGrid columns="1" style="margin-bottom: 10px; margin-top: -10px">
                        <p:inputText id="rValue" value="#{sliderBean.number}" readonly="true" onchange="repaint()">
                            <f:ajax event="change" execute="rValue" render="sliderK"/>
                        </p:inputText>

                        <!-- Слайдер, который обновляет значение в бине при перемещении -->
                        <p:slider id="fd" for="rValue" widgetVar="inputWidget" minValue="2" maxValue="5" step="0.1" range="min" required="true"
                                  onSlideEnd="repaint()">
                            <p:ajax event="slideEnd" listener="#{sliderBean.OK}"/>
                        </p:slider>

                        <!-- Вывод значения из бина -->
                        <h:outputText value="#{sliderBean.number}" id="sliderK" style="display:none;"/>
                    </h:panelGrid>
<!--                    <h:inputText id="number" value="#{sliderBean.number}" />-->
<!--                    <p:slider for="number" minValue="0.2" maxValue="7.1" step="0.1" range="max"/>-->
<!--                    <label id="r1">Введите значение R:-->
<!--                        <p:slider minValue="0.2" maxValue="7.1" step="0.1"/>-->
<!--&lt;!&ndash;                        <input type="text" name="r" id="rInput" placeholder="число от 1 до 4"/>&ndash;&gt;-->
<!--                    </label>-->
<!--                    <span id="rExcept" class="exception"></span>-->
                </div>
                <div>
                    Информация об отправке:
                    <span id="submitInfo"> </span>
                </div>
                <h:commandButton id="submit" value="Отправить" action="#{graphManager.add}" onclick="drawDotByParams()">
                    <f:ajax action="submit" render="table"/>
                </h:commandButton>

                <div style="margin-top: 100px; font-size: 20px">
                    <h:commandButton value="К таблице результатов" action="goToResults" />
                    <h:commandButton value="К начальной странице" action="goToStart" />
                </div>
            </h:form>
        </div>
<!--        <div>-->
<!--            <table id="results" border="1">-->
<!--                <tr>-->
<!--                    <td>X, Y, R</td>-->
<!--                    <td>Попадание</td>-->
<!--                    <td>Время обращения к серверу</td>-->
<!--                    <td>Время обработки запроса, нс</td>-->
<!--                </tr>-->
<!--            </table>-->
<!--        </div>-->
        <h:dataTable value="#{graphManager.getLastHits()}" var="hit" border="1" id="table">
            <h:column>
                <f:facet name="header">X, Y, R</f:facet>
                #{hit.x}, #{hit.y}, #{hit.r}
            </h:column>

            <h:column>
                <f:facet name="header">Попадание</f:facet>
                #{hit.hit}
            </h:column>

            <h:column>
                <f:facet name="header">Время обращения к серверу</f:facet>
                #{hit.date}
            </h:column>

            <h:column>
                <f:facet name="header">Время обработки запроса, нс</f:facet>
                #{hit.duration}
            </h:column>
        </h:dataTable>

    </div>

</f:view>
</h:body>
</html>
