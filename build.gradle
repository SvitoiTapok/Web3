plugins {
    id 'java'
    id 'war'
}
group 'com.example'
version '1.0-SNAPSHOT'
repositories {
    mavenCentral()
    maven { url 'https://repo.maven.apache.org/maven2' } // возможно, требуется другой репозиторий
}

ext {
    junitVersion = '5.10.0'
}

sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.eclipse.persistence:eclipselink:3.0.0'
    implementation 'org.hibernate:hibernate-core:5.6.15.Final'
    implementation 'org.postgresql:postgresql:42.5.4'
    implementation 'com.mchange:c3p0:0.9.5.5'
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'jakarta.ejb:jakarta.ejb-api:4.0.1'
    implementation 'jakarta.faces:jakarta.faces-api:3.0.0'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.platform:jakarta.jakartaee-web-api:9.0.0'
    implementation 'jakarta.json:jakarta.json-api:2.1.1'
    implementation 'jakarta.json.bind:jakarta.json.bind-api:3.0.0'
    implementation 'org.postgresql:postgresql:42.6.0'
    implementation 'org.hibernate:hibernate-core:6.2.6.Final'
    implementation 'org.primefaces:primefaces:12.0.0:jakarta'
    implementation 'com.google.guava:guava:31.0.1-jre'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'
//    implementation 'jakarta.management:jakarta.management-api:2.0.0'
    implementation 'org.glassfish.main.external:jmxremote_optional-repackaged:5.0'

    runtimeOnly 'org.flywaydb:flyway-gradle-plugin:9.16.1'
    compileOnly 'org.projectlombok:lombok:1.18.26'

    annotationProcessor 'org.projectlombok:lombok:1.18.26'
    testCompileOnly 'org.projectlombok:lombok:1.18.26'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.26'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
////
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'
}
test {
    useJUnitPlatform()
    reports {
        junitXml.required = true;
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}